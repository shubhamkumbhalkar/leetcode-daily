# LeetCode-a-day config
# mode: 'list'  -> progress in order through a curated list (Blind 75) — best for structured prep
#       'daily' -> LeetCode's official Daily Challenge (their pick of the day)
mode: list
include_hint: true          # add a no-spoiler approach hint (via kiro-cli, local/free)
backend: local
slack_webhook_file: "~/.mcf-daily-improver/slack_webhook"
