# LeetCode-a-day config
# mode: 'list'  -> progress in order through a curated list (Blind 75) — best for structured prep
#       'daily' -> LeetCode's official Daily Challenge (their pick of the day)
mode: list
include_hint: true          # add a no-spoiler approach hint (via kiro-cli, local/free)
backend: local
slack_webhook_file: "~/.mcf-daily-improver/slack_webhook"

# Dedicated LeetCode channel + emoji reveal. Reuses the same bot as opportunity-finder.
# Invite the bot to a new private #leetcode channel; react with 💡 to reveal the walkthrough.
slack_bot:
  enabled: true
  token_file: "~/.opportunity-finder/slack_bot_token"
  channel_id: "C0C0XHNEP0D"
  reveal_emoji: ["bulb", "brain", "eyes", "white_check_mark"]
  poll_interval: 60
